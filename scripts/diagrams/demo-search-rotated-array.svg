<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f4f9fe"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d9e9f7" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <g font-size="17" fill="#2c3e50">
    <text x="100" y="50" text-anchor="end">nums</text>
    <g stroke-width="1.5">
      <rect x="110" y="25" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="150" y="25" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="190" y="25" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="230" y="25" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="270" y="25" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="310" y="25" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="350" y="25" width="40" height="40" fill="#fbe5e3" stroke="#d9534f"/>
      <rect x="390" y="25" width="40" height="40" fill="#fbe5e3" stroke="#d9534f"/>
      <rect x="430" y="25" width="40" height="40" fill="#fbe5e3" stroke="#d9534f"/>
    </g>
    <g text-anchor="middle">
      <text x="130" y="51">4</text>
      <text x="170" y="51">5</text>
      <text x="210" y="51">6</text>
      <text x="250" y="51">7</text>
      <text x="290" y="51">8</text>
      <text x="330" y="51">9</text>
      <text x="370" y="51">0</text>
      <text x="410" y="51">1</text>
      <text x="450" y="51">2</text>
    </g>
    <g font-size="16" fill="#555" text-anchor="middle">
      <text x="130" y="85">left</text>
      <text x="290" y="85">mid</text>
      <text x="450" y="85">right</text>
    </g>
    <rect x="530" y="25" width="330" height="40" fill="url(#hatch)"/>
    <text x="695" y="50" text-anchor="middle" font-style="italic">nums[mid] &gt; nums[left]</text>
  </g>

  <g font-size="17" fill="#2c3e50">
    <text x="100" y="180" text-anchor="end">nums</text>
    <g stroke-width="1.5">
      <rect x="110" y="155" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="150" y="155" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="190" y="155" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="230" y="155" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="270" y="155" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="310" y="155" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="350" y="155" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="390" y="155" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="430" y="155" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
    </g>
    <g text-anchor="middle">
      <text x="130" y="181">4</text>
      <text x="170" y="181">5</text>
      <text x="210" y="181">6</text>
      <text x="250" y="181">7</text>
      <text x="290" y="181">8</text>
      <text x="330" y="181">9</text>
      <text x="370" y="181">0</text>
      <text x="410" y="181">1</text>
      <text x="450" y="181">2</text>
    </g>
    <g font-size="16" fill="#555" text-anchor="middle">
      <text x="130" y="215">left</text>
      <text x="290" y="215">mid</text>
      <text x="450" y="215">right</text>
    </g>
    <rect x="530" y="155" width="330" height="40" fill="url(#hatch)"/>
    <text x="695" y="180" text-anchor="middle" font-style="italic">thus the subarray on mid's left is sorted</text>
  </g>

  <g font-size="17" fill="#2c3e50">
    <text x="100" y="310" text-anchor="end">nums</text>
    <g stroke-width="1.5">
      <rect x="110" y="285" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="150" y="285" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="190" y="285" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="230" y="285" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="270" y="285" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="310" y="285" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="350" y="285" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="390" y="285" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
      <rect x="430" y="285" width="40" height="40" fill="#ffffff" stroke="#9aa5b1"/>
    </g>
    <g text-anchor="middle">
      <text x="130" y="311">4</text>
      <text x="170" y="311">5</text>
      <text x="210" y="311">6</text>
      <text x="250" y="311">7</text>
      <text x="290" y="311">8</text>
      <text x="330" y="311">9</text>
      <text x="370" y="311">0</text>
      <text x="410" y="311">1</text>
      <text x="450" y="311">2</text>
    </g>
    <g font-size="16" fill="#555" text-anchor="middle">
      <text x="130" y="345">left</text>
      <text x="290" y="345">mid</text>
      <text x="450" y="345">right</text>
    </g>
    <rect x="530" y="283" width="330" height="52" fill="url(#hatch)"/>
    <text x="695" y="303" text-anchor="middle" font-style="italic">Determine if target is likely</text>
    <text x="695" y="325" text-anchor="middle" font-style="italic">to be in this subarray</text>
  </g>

  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="350" y1="368" x2="188" y2="416" marker-end="url(#arrow)"/>
    <line x1="350" y1="368" x2="512" y2="416" marker-end="url(#arrow)"/>
  </g>

  <g font-size="17" fill="#2c3e50">
    <rect x="30" y="420" width="300" height="115" rx="16" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
    <text x="78" y="472" text-anchor="end">nums</text>
    <g stroke-width="1.5">
      <rect x="88" y="442" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="128" y="442" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="168" y="442" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="208" y="442" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
    </g>
    <g text-anchor="middle">
      <text x="108" y="468">4</text>
      <text x="148" y="468">5</text>
      <text x="188" y="468">6</text>
      <text x="228" y="468">7</text>
    </g>
    <g font-size="16" fill="#555" text-anchor="middle">
      <text x="108" y="505">left</text>
      <text x="228" y="505">right</text>
    </g>
    <rect x="30" y="550" width="300" height="50" fill="url(#hatch)"/>
    <text x="180" y="570" text-anchor="middle">If so, move on to this</text>
    <text x="180" y="592" text-anchor="middle">subarray</text>
  </g>

  <g font-size="17" fill="#2c3e50">
    <rect x="350" y="420" width="300" height="115" rx="16" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
    <text x="398" y="472" text-anchor="end">nums</text>
    <g stroke-width="1.5">
      <rect x="408" y="442" width="40" height="40" fill="#e6f4e6" stroke="#4a9d4a"/>
      <rect x="448" y="442" width="40" height="40" fill="#fbe5e3" stroke="#d9534f"/>
      <rect x="488" y="442" width="40" height="40" fill="#fbe5e3" stroke="#d9534f"/>
      <rect x="528" y="442" width="40" height="40" fill="#fbe5e3" stroke="#d9534f"/>
    </g>
    <g text-anchor="middle">
      <text x="428" y="468">9</text>
      <text x="468" y="468">0</text>
      <text x="508" y="468">1</text>
      <text x="548" y="468">2</text>
    </g>
    <g font-size="16" fill="#555" text-anchor="middle">
      <text x="428" y="505">left</text>
      <text x="548" y="505">right</text>
    </g>
    <rect x="350" y="550" width="300" height="50" fill="url(#hatch)"/>
    <text x="500" y="570" text-anchor="middle">Otherwise, continue with the</text>
    <text x="500" y="592" text-anchor="middle">other subarray</text>
  </g>
</svg>
